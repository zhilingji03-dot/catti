@media(max-width:520px){.wrap{padding-top:20px}.panel{border-radius:22px;min-height:0}.top{margin-bottom:18px}.btn{width:100%}.btnrow{display:grid}}

const app=document.getElementById('app');let idx=0,answers=[],scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
function show(html){app.innerHTML='<div class="view">'+html+'</div>'}
function home(){show(`<div class="kicker">Маленький тест о большом внутреннем мире</div><div class="hero-cat">🐈</div><h1>Какой ты<br>котик?</h1><p>24 вопроса отделяют тебя от знакомства с твоим внутренним котом. Выбирай то, что ближе именно тебе. Здесь нет правильных ответов.</p><div class="btnrow"><button class="btn" onclick="start()">Начать тест →</button></div><p class="small">≈ 2–3 минуты · без правильных и неправильных ответов</p>`)}
function start(){idx=0;answers=[];scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};question()}
function question(){let q=questions[idx];show(`<button class="back" onclick="goBack()">← Назад</button><div class="qnum"><span>ВОПРОС ${String(idx+1).padStart(2,'0')} / 24</span><span>CATTI</span></div><div class="progressline"><span style="width:${(idx+1)/24*100}%"></span></div><div class="kicker">Выбирай сердцем</div><h2>${q[0]}</h2><div class="answers">${q[1].map((a,i)=>`<button class="answer" onclick="choose('${a[1]}')">${a[0]}</button>`).join('')}</div>`)}
function choose(letter){answers[idx]=letter;if(idx<23){idx++;question()}else result()}
function goBack(){if(idx>0){idx--;question()}else home()}
function result(){scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};answers.forEach(x=>scores[x]++);let type=['E','S','T','J'].map((a,i)=>{let b=['I','N','F','P'][i];return scores[a]>=scores[b]?a:b}).join('');let c=cats[type];let total=scores.E+scores.I+scores.S+scores.N+scores.T+scores.F+scores.J+scores.P;let bars=[['E','Экстраверсия','I'],['S','Конкретика','N'],['T','Логика','F'],['J','Структура','P']];show(`<div class="result-head"><div class="kicker">ТВОЙ КОТИК НАЙДЕН</div><div class="cat-art">${catArt(type,true)}</div><span class="type">${type}</span><div class="result-title">${c[0]}</div><p>${c[2]}</p><div class="traits">${c.slice(4).map(t=>`<span class="trait">${t}</span>`).join('')}</div></div><p>${c[3]}</p><h2 style="font-size:27px;margin-top:34px">Твои восемь измерений</h2><div class="stats">${bars.map(([a,n,b])=>{let left=scores[a],right=scores[b],sum=left+right,p=sum?Math.round(left/sum*100):50;return `<div class="stat"><b>${a}</b><div><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>${n}</span><span>${b}</span></div><div class="bar"><span style="width:${p}%"></span></div></div><b>${b}</b></div>`}).join('')}</div><div class="note">Это развлекательный тест, а не психологическая диагностика. Результат показывает твои ответы сегодня — и не обязан описывать тебя целиком.</div><div class="btnrow"><button class="btn" onclick="encyclopedia('${type}')">Кошачья энциклопедия</button><button class="btn light" onclick="share('${type}')">Поделиться результатом</button><button class="btn light" onclick="start()">Пройти ещё раз</button></div>`)}
function encyclopedia(active){show(`<button class="back" onclick="result()">← К результату</button><div class="gallery-intro"><div class="gallery-stamp">🐾</div><div><div class="kicker">КОШАЧЬЯ ЭНЦИКЛОПЕДИЯ</div><h2 style="margin:5px 0">16 характеров — 16 котиков</h2></div></div><p>Каждый котик нарисован в своём стиле. Нажми на карточку, чтобы познакомиться поближе.</p><div class="grid">${Object.entries(cats).map(([t,c])=>`<button class="catcard ${t===active?'active':''}" onclick="detail('${t}')">${catArt(t)}<strong>${c[0]}</strong><small>${t}</small></button>`).join('')}</div><div class="btnrow"><button class="btn light" onclick="result()">Вернуться к результату</button></div>`)}
function detail(t){let c=cats[t];show(`<button class="back" onclick="encyclopedia('${t}')">← К энциклопедии</button><div class="result-head"><div class="cat-art">${catArt(t,true)}</div><span class="type">${t}</span><div class="result-title">${c[0]}</div><p>${c[2]}</p></div><p>${c[3]}</p><div class="traits">${c.slice(4).map(x=>`<span class="trait">${x}</span>`).join('')}</div><div class="btnrow"><button class="btn light" onclick="encyclopedia('${t}')">Все котики</button></div>`)}
function share(t){let c=cats[t],txt=`Мой результат CatTi: ${c[0]} (${t}) 🐾 ${c[2]}`;if(navigator.share)navigator.share({title:'Мой котик',text:txt}).catch(()=>{});else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>alert('Результат скопирован!'))}else alert(txt)}
home();
</script></body></html>
